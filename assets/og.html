<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilo.css">
<style>body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0f19}
.og{position:relative;width:1200px;height:630px;color:#f2f3f5}
.og canvas{position:absolute;inset:0;width:100%;height:100%}
.og::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(11,15,25,.96) 0%,rgba(11,15,25,.85) 48%,rgba(11,15,25,.1) 85%)}
.t{position:relative;z-index:2;padding:56px 64px}
.t .marca{font-size:1.5rem} .t .logo{width:38px;height:38px}
.t h1{font:800 64px/1.02 var(--display);letter-spacing:-.03em;margin:40px 0 28px;max-width:720px}
.t p{margin:0;display:flex;align-items:baseline;gap:18px}
.t b{font:800 92px/1 var(--display);letter-spacing:-.04em;color:#fff}
.t p span{font-size:24px;color:#aab2c3;max-width:15ch;line-height:1.25}</style></head>
<body><div class="og"><canvas id="constelacion" data-uso="5814" data-resto="4140"></canvas>
<div class="t"><span class="marca"><svg class='logo' viewBox='0 0 32 32' aria-hidden='true'><g fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round'><path d='M9 25c-2-2.6-3-5.6-3-9a10 10 0 0 1 17.5-6.6'/><path d='M13 27c-1.8-3-2.8-6.3-2.8-10a5.8 5.8 0 0 1 11.6 0c0 1.6-.1 3-.4 4.4'/><path d='M16 17c0 4 1 7.6 3 10.5'/><path d='M26 13.5c.3 1.1.4 2.3.4 3.5 0 3-.5 5.6-1.5 7.9'/></g></svg><span>La Huella del Dato</span></span>
<h1>¿Quién usa de verdad los datos públicos españoles?</h1>
<p><b>55.457</b><span>reutilizaciones reales en 35 portales</span></p></div></div>
<script>matchMedia=()=>({matches:true});(()=>{const c=document.getElementById('constelacion');if(!c||!c.getContext)return;
const uso=+c.dataset.uso,n=uso+(+c.dataset.resto),ctx=c.getContext('2d');
const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
let s=2026;const azar=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cl=new Uint8Array(n);for(let i=0;i<uso;i++)cl[i]=1;
for(let i=n-1;i>0;i--){const j=Math.floor(azar()*(i+1)),v=cl[i];cl[i]=cl[j];cl[j]=v}
const jx=new Float32Array(n),jy=new Float32Array(n),re=new Float32Array(n);
for(let i=0;i<n;i++){jx[i]=azar()-.5;jy[i]=azar()-.5;re[i]=azar()}
let dpr=1,pts=null;
function medir(){dpr=Math.min(devicePixelRatio||1,2);const W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
c.width=W*dpr;c.height=H*dpr;const cols=Math.ceil(Math.sqrt(n*W/H)),filas=Math.ceil(n/cols),cw=W/cols,ch=H/filas;
pts=new Float32Array(2*n);for(let i=0;i<n;i++){pts[2*i]=((i%cols)+.5+jx[i]*.85)*cw*dpr;pts[2*i+1]=(Math.floor(i/cols)+.5+jy[i]*.85)*ch*dpr}}
function pintar(t){if(!pts)return;ctx.clearRect(0,0,c.width,c.height);const r=1.15*dpr;
ctx.fillStyle='rgba(150,162,186,.30)';for(let i=0;i<n;i++){if(cl[i]&&re[i]<t)continue;ctx.fillRect(pts[2*i]-r,pts[2*i+1]-r,2*r,2*r)}
ctx.fillStyle='#ff7a45';ctx.shadowColor='rgba(255,122,69,.8)';ctx.shadowBlur=6*dpr;ctx.beginPath();
for(let i=0;i<n;i++){if(cl[i]&&re[i]<t){ctx.moveTo(pts[2*i]+r*1.4,pts[2*i+1]);ctx.arc(pts[2*i],pts[2*i+1],r*1.4,0,6.2832)}}
ctx.fill();ctx.shadowBlur=0}
medir();
if(quieto){pintar(1)}else{let t0=null;const dur=2600,esp=500;
const paso=ts=>{if(t0===null)t0=ts;const k=Math.min(1,Math.max(0,(ts-t0-esp)/dur));pintar(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(paso)};
pintar(0);requestAnimationFrame(paso)}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{medir();pintar(1)},150)});})();</script></body></html>
